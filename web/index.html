<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f8f8" />
    <title>ADO Ticket Reviewer</title>
    <script>
      // Applied before first paint. Doing this in React instead would show a
      // white flash on every load for anyone who chose dark.
      try {
        var stored = localStorage.getItem('ado-reviewer-theme');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.setAttribute('data-theme', stored);
          document.querySelector('meta[name="theme-color"]').content =
            stored === 'dark' ? '#0b0d10' : '#f8f8f8';
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.querySelector('meta[name="theme-color"]').content = '#0b0d10';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
